<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>富士急モビリティ湘南営業所 - 過去の運用情報</title>
  <link rel="stylesheet" href="kk.css">
  <script src="main.js" defer></script> <!-- descriptions を使う -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ja.js"></script>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <style>
    body {
      font-family: "MS Gothic", sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      background-color:  #3e6148;
      color: white;
      padding: 20px;
      position: relative;
      font-size: 32px; 
      font-weight: bold; /* ← 文字を太字に */
    }

    header a {
      position: absolute;
      left: 17px;
      top: 50%;
      transform: translateY(-50%);
      background-color: #0059ff;
      color: white;
      padding: 6px 12px;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
    }

    table {
      width: 95%;
      margin: 20px auto;
      border-collapse: collapse;
    }

    th, td {
      border: 2px solid #000000;
      padding: 8px;
      text-align: center;
    }

    th {
      background-color: #efefef;
    }


    .label-cell {
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }

    .holiday-label-cell {
      background-color: #fe5656cc;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }

    .popup-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .popup-box {
      background: white;
      padding: 20px;
      border-radius: 8px;
      width: 90%;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
      text-align: left;
    }

    .popup-title {
      font-size: 24px;               /* タイトルのサイズ */
      font-weight: bold;
      font-family: "MS Gothic", sans-serif;
      margin-bottom: 10px;
    }

    .popup-description {
      font-size: 20px;               /* ダイヤの説明 */
      font-family: "MS Gothic", sans-serif;
      text-align: left;
      display: block;
      white-space: pre-wrap;
      background-color: #f9f9f9;
      border: 1px solid #ccc;
      padding: 10px;
      border-radius: 4px;
    }

    .popup-close {
      margin-top: 15px;
      text-align: right;
    }

    .popup-close button {
      padding: 6px 12px;
    }

    .flatpickr-calendar {
      font-family: "MS Gothic", sans-serif;
      font-size: 18px;
    }

    .flatpickr-months .flatpickr-month,
    .flatpickr-weekdays,
    .flatpickr-days {
      font-size: 18px;
    }

    .flatpickr-day {
      padding: 10px;
      line-height: 1.8;
    }
  </style>
</head>

<body>
  <header>
    <a href="home.html">トップへ戻る</a>
    富士急モビリティ湘南営業所　過去の運用情報
  </header>

  <div style="padding: 20px;">
      <label for="datePicker" style="display: inline-block; cursor: pointer;">
      <span style="font-size: 24px; font-weight: bold;"></span>
      <input type="text" id="datePicker" placeholder="日付を選択" autocomplete="off" style="
        font-size: 20px;
        padding: 10px 12px;
        height: 44px;
        width: 220px;
        cursor: pointer;
        background-color: white;
        border: 1px solid #999;
        border-radius: 4px;
      ">
      </label>
  </div>
  <script>
    flatpickr("#datePicker", {
      locale: "ja", // 日本語化（必要なら）
      dateFormat: "Y-m-d", // 表示形式
      defaultDate: "today", // ← ここを追加
      allowInput: false // ← 手入力を禁止（カレンダーからのみ選択）
    });
  </script>
  <table>
    <thead>
      <tr>
        <th>ダイヤ</th>
        <th>車両番号</th>
        <th>備考</th>
      </tr>
    </thead>
    <tbody id="mainTable"></tbody>
  </table>

  <!-- 説明ポップアップ -->
  <div class="popup-overlay" id="popupOverlay">
    <div class="popup-box">
      <div class="popup-title" id="popupTitle">ダイヤ情報</div>
      <div class="popup-description" id="popupDescription">説明がここに表示されます。</div>
      <div class="popup-close">
        <button onclick="document.getElementById('popupOverlay').style.display='none'">閉じる</button>
      </div>
    </div>
  </div>

  <script>
    const tableBody = document.getElementById('mainTable');
    const datePicker = document.getElementById('datePicker');

    // 日祝判定（main.jsのholidayMapを活用する前提）
    function isHoliday(dateStr) {
      const date = new Date(dateStr);
      return date.getDay() === 0 || date.getDay() === 6 || (window.holidayMap && window.holidayMap[dateStr]);
    }

    // 日付選択イベント
    datePicker.addEventListener('change', async () => {
      const selectedDate = datePicker.value;
      if (!selectedDate) return;

      const response = await fetch(`/api/schedules?date=${selectedDate}`);
      const data = await response.json();

      const existingData = {};
      data.forEach(item => {
        existingData[item.label] = item;
      });

      const isHolidaySelected = isHoliday(selectedDate);
      const dayType = isHolidaySelected ? '土休日' : '平日';
      const maxDial = isHolidaySelected ? 11 : 19;

      tableBody.innerHTML = '';
      for (let i = 1; i <= maxDial; i++) {
        const tr = document.createElement('tr');
        const labelText = `${dayType}${String(i).padStart(2, '0')}ダイヤ`;

        const tdLabel = document.createElement('td');
        tdLabel.className = isHolidaySelected ? 'holiday-label-cell' : 'label-cell';
        tdLabel.textContent = labelText;
        tdLabel.onclick = () => showDescription(labelText);

        const tdCar = document.createElement('td');
        tdCar.textContent = existingData[labelText]?.car_number || '未入力';

        const tdNote = document.createElement('td');
        tdNote.textContent = existingData[labelText]?.note || '未入力';

        tr.appendChild(tdLabel);
        tr.appendChild(tdCar);
        tr.appendChild(tdNote);
        tableBody.appendChild(tr);
      }
    });

    // ダイヤ説明表示
    function showDescription(labelText) {
      const descriptions = window.descriptions || {};
      document.getElementById('popupTitle').textContent = labelText;
      document.getElementById('popupDescription').textContent = descriptions[labelText] || '説明は登録されていません。';
      document.getElementById('popupOverlay').style.display = 'flex';
    }
  </script>
</body>

</html>
