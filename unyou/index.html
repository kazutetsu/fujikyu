<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>運用調査</title>
  <script src="https://cdn.jsdelivr.net/npm/japanese-holidays@1.0.8/lib/japanese-holidays.min.js"></script>
  <script src="main.js" defer></script>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <link rel="stylesheet" href="kk.css">
  <style>
    body {
      font-family: "MS Gothic", sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      background-color:   #3e6148;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 32px; 
      font-weight: bold; /* ← 文字を太字に */
    }

    table {
      width: 95%;
      margin: 20px auto;
      border-collapse: collapse;
      z-index: 1;
      position: relative;
    }

    th, td {
      border: 2px solid #000000;
      padding: 8px;
      text-align: center;
    }

    th {
      background-color: #efefef;
    }


    .label-cell {
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }

    .form-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      z-index: 10;
      justify-content: center;
      align-items: center;
    }

    .form-container {
      background: #fff;
      padding: 20px;
      border-radius: 4px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .form-group {
      margin-bottom: 10px;
      text-align: left;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 6px;
      box-sizing: border-box;
      font-size: 20px; /* ← 文字サイズを追加 */
      font-family: "MS Gothic", sans-serif; /* 任意でフォントも揃える */
    }

    button {
      padding: 6px 12px;
      font-size: 17px;
      margin: 5px;
    }

    .popup-title {
      font-size: 24px;               /* タイトルのサイズ */
      font-weight: bold;
      font-family: "MS Gothic", sans-serif;
      margin-bottom: 10px;
      text-align: left;
      display: block;
    }

    .popup-description {
      font-size: 20px;               /* ダイヤの説明 */
      font-family: "MS Gothic", sans-serif;
      text-align: left;
      display: block;
      white-space: pre-wrap;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

<header>
  <div style="position: relative;">
    <a href="home.html" style="
      position: absolute;
      left: 17px;
      top: 50%;
      transform: translateY(-50%);
      background-color: #0059ff;
      color: white;
      padding: 6px 12px;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
     ">トップへ戻る</a>
    <span id="dayTypeTitle">富士急モビリティ湘南営業所　運用調査　平日</span>
  </div>
</header>


  <!-- 入力フォームオーバーレイ -->
  <div class="form-overlay" id="formOverlay">
    <div class="form-container">
      <div class="popup-title" id="popupTitle">ダイヤ情報</div>
      <div class="popup-description" id="popupDescription"></div>

      <div class="form-group">
        <label for="carNumber">車両番号</label>
        <input type="text" id="carNumber">
      </div>
      <div class="form-group">
        <label for="note">備考</label>
        <textarea id="note" rows="3"></textarea>
      </div>
      <button onclick="applyEdit()">適用</button>
      <button onclick="closeForm()">キャンセル</button>
    </div>
  </div>

  <!-- 表 -->
  <table>
    <thead>
      <tr>
        <th>ダイヤ</th>
        <th>車両番号</th>
        <th>備考</th>
        <th>現在位置</th> <!-- ← 追加 -->
      </tr>
    </thead>
    <tbody id="mainTable"></tbody>
      <!-- JavaScriptで生成 -->

  </table>

</body>

</html>
